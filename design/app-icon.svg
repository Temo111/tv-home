<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset=".55" stop-color="#1e2350"/>
      <stop offset="1" stop-color="#3b2a5a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".64" r=".5">
      <stop offset="0" stop-color="#ff9a5a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14183a"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="116"/></clipPath>
    <clipPath id="above"><rect width="512" height="328"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <circle cx="256" cy="328" r="112" fill="url(#sun)" clip-path="url(#above)"/>
    <rect y="328" width="512" height="184" fill="url(#sea)"/>
    <rect x="96" y="352" width="320" height="12" rx="6" fill="#ffb36b" opacity=".85"/>
    <rect x="146" y="386" width="220" height="12" rx="6" fill="#ffb36b" opacity=".55"/>
    <rect x="196" y="420" width="120" height="12" rx="6" fill="#ffb36b" opacity=".3"/>
  </g>
</svg>
